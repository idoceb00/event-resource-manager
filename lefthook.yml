pre-commit:
  commands:
    frontend-lint:
      root: "frontend/"
      glob: "*.{ts,svelte,js,json,css,md}"
      run: pnpm exec eslint {staged_files} --fix
      stage_fixed: true
    frontend-format:
      root: "frontend/"
      glob: "*.{json,css,md}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    backend-format:
      root: "backend/"
      glob: "*.java"
      run: mvn spotless:apply
      stage_fixed: true

pre-push:
  commands:
    frontend-tests:
      root: "frontend/"
      run: pnpm run test -- --run && pnpm run svelte-check
    backend-tests:
      root: "backend/"
      run: mvn test