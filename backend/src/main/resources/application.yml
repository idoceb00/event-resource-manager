app:
  cors:
    allowed-origins: http://localhost:5173

server:
  servlet:
    session:
      cookie:
        http-only: true
        # lax: cookie is sent on same-site navigations and top-level cross-origin
        # GET/POST. strict would block it entirely when frontend and backend run on
        # different ports (different origins). "lax" is the standard for SPA + API.
        same-site: lax
        # NOTE: secure: true only works over HTTPS. For local HTTP dev this
        # must be false — overridden in application-dev.yml.
        secure: true
